
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 01 - Microservices</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f9;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        .container {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        input {
            padding: 10px;
            width: 200px;
            margin-right: 10px;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        pre {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>LAB 01 - MICROSERVICES</h1>

    <div class="container">
        <h2>Danh sách sản phẩm</h2>

        <button onclick="loadProducts()">
            Tải danh sách sản phẩm
        </button>

        <ul id="productList">
            Chưa tải dữ liệu
        </ul>
    </div>

    <div class="container">
        <h2>Tìm sản phẩm thông qua Order Service</h2>

        <input
            type="number"
            id="productId"
            placeholder="Nhập ID sản phẩm"
            min="1"
        >

        <button onclick="findProduct()">
            Tìm sản phẩm
        </button>

        <pre id="result">Kết quả tìm kiếm sẽ hiển thị ở đây</pre>
    </div>

    <script>

        // Lấy danh sách sản phẩm từ Product Service
        async function loadProducts() {

            const list = document.getElementById("productList");

            try {
                const response = await fetch(
                    "http://localhost:8081/api/products"
                );

                if (!response.ok) {
                    throw new Error("Không thể tải danh sách sản phẩm");
                }

                const products = await response.json();

                list.innerHTML = "";

                if (products.length === 0) {
                    list.textContent = "Chưa có sản phẩm";
                    return;
                }

                products.forEach(product => {

                    const li = document.createElement("li");

                    li.textContent =
                        `${product.id} - ${product.name}`;

                    list.appendChild(li);
                });

            } catch (error) {

                list.textContent = "Lỗi: " + error.message;

            }
        }


        // Tìm sản phẩm thông qua Order Service
        async function findProduct() {

            const id = document.getElementById("productId").value;

            const result = document.getElementById("result");

            if (!id || !Number.isInteger(Number(id)) || Number(id) < 1) {

                result.textContent = "Vui lòng nhập ID hợp lệ";

                return;
            }

            try {

                const response = await fetch(
                    `http://localhost:8082/api/orders/product/${id}`
                );

                if (response.status === 404) {

                    result.textContent = "Không tìm thấy sản phẩm";

                    return;
                }

                if (!response.ok) {

                    throw new Error("Không thể lấy thông tin sản phẩm");

                }

                const product = await response.json();

                result.textContent =
                    JSON.stringify(product, null, 2);

            } catch (error) {

                result.textContent = "Lỗi: " + error.message;

            }
        }

    </script>

</body>
</html>
